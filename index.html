<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5b3a29">
  <title>お酒100種コンプリート</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #ffffff;
      --ink: #2b2320;
      --sub: #8a7d72;
      --line: #e7ded4;
      --accent: #a8542b;
      --accent-soft: #f3e3d8;
      --gold: #d4a017;
      --danger: #c0392b;
      --ok: #2e7d5b;
      --shadow: 0 2px 10px rgba(80,50,30,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1815;
        --card: #292320;
        --ink: #f2ebe4;
        --sub: #a89a8d;
        --line: #3a322c;
        --accent: #e08a4f;
        --accent-soft: #3a2c22;
        --gold: #e8c157;
        --danger: #e57368;
        --ok: #5fc79a;
        --shadow: 0 2px 12px rgba(0,0,0,.3);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.5;
      padding: 0 0 44px;
      max-width: 640px;
      margin: 0 auto;
    }
    header { padding: 20px 18px 10px; text-align: center; }
    header h1 { font-size: 1.3rem; letter-spacing: .03em; }
    header p { color: var(--sub); font-size: .78rem; margin-top: 3px; }

    /* progress */
    .progress {
      display: flex; align-items: center; gap: 18px;
      background: var(--card); border-radius: 18px;
      margin: 8px 14px 16px; padding: 18px; box-shadow: var(--shadow);
    }
    .ring {
      width: 108px; height: 108px; border-radius: 50%;
      display: grid; place-items: center; flex-shrink: 0;
      background: conic-gradient(var(--accent) 0deg, var(--line) 0deg);
      transition: background .5s ease;
    }
    .ring-inner {
      width: 84px; height: 84px; border-radius: 50%; background: var(--card);
      display: grid; place-items: center; text-align: center;
    }
    .ring-num { font-size: 1.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .ring-den { font-size: .8rem; color: var(--sub); font-weight: 600; }
    .ring-lbl { font-size: .62rem; color: var(--sub); margin-top: 3px; }
    .pside { flex: 1; }
    .pbar { height: 9px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 6px 0 10px; }
    .pbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 6px; width: 0; transition: width .5s ease; }
    .pside .big { font-size: 1.05rem; font-weight: 700; }
    .pside .sub { font-size: .78rem; color: var(--sub); }
    .pmsg { font-size: .82rem; color: var(--gold); font-weight: 700; margin-top: 8px; min-height: 1em; }

    /* add form */
    form { background: var(--card); border-radius: 16px; margin: 0 14px 14px; padding: 16px; box-shadow: var(--shadow); }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .field { flex: 1; }
    label { display: block; font-size: .72rem; color: var(--sub); margin-bottom: 4px; }
    input, select {
      width: 100%; background: var(--bg); color: var(--ink);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn:active { opacity: .85; }
    .msg { font-size: .82rem; margin-top: 10px; min-height: 1em; }
    .msg.err { color: var(--danger); font-weight: 600; }
    .msg.ok { color: var(--ok); font-weight: 600; }
    .msg.warn { color: var(--gold); font-weight: 600; }

    /* list */
    .toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 18px 4px; }
    .toolbar h2 { font-size: .95rem; flex-shrink: 0; }
    #search { flex: 1; padding: 8px 12px; font-size: 14px; }

    .cat { margin: 4px 14px 0; }
    .cat h3 { font-size: .76rem; color: var(--sub); font-weight: 700; margin: 12px 4px 8px; display: flex; justify-content: space-between; }
    .cat h3 .cnt { color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card); border: 1px solid var(--line); border-radius: 22px;
      padding: 7px 8px 7px 12px; font-size: .84rem; box-shadow: var(--shadow); max-width: 100%;
    }
    .chip.seed { }
    .chip.custom { border-color: var(--accent); background: var(--accent-soft); }
    .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .x { border: none; background: none; color: var(--sub); font-size: 1rem; cursor: pointer; line-height: 1; padding: 0 2px; }
    .chip .x:active { color: var(--danger); }
    .empty { color: var(--sub); font-size: .85rem; padding: 10px 6px; }

    .tools { display: flex; gap: 10px; padding: 20px 14px 0; }
    .tools button { flex: 1; background: none; border: 1px solid var(--line); color: var(--sub); border-radius: 10px; padding: 10px; font-size: .8rem; cursor: pointer; font-family: inherit; }

    /* おすすめ未取得パネル */
    #suggestPanel { background: var(--card); border-radius: 16px; margin: 0 14px 14px; padding: 4px 6px; box-shadow: var(--shadow); }
    #suggestPanel summary { cursor: pointer; padding: 12px; font-size: .9rem; font-weight: 600; list-style: none; }
    #suggestPanel summary::-webkit-details-marker { display: none; }
    #suggestPanel summary::after { content: "▾"; float: right; color: var(--sub); }
    #suggestPanel[open] summary::after { content: "▴"; }
    .sgroup { padding: 2px 12px 8px; }
    .sgroup h4 { font-size: .72rem; color: var(--sub); margin-bottom: 7px; font-weight: 600; }
    .schips { display: flex; flex-wrap: wrap; gap: 7px; }
    .schip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--bg); border: 1px dashed var(--accent); color: var(--ink);
      border-radius: 20px; padding: 6px 11px; font-size: .8rem; cursor: pointer; font-family: inherit;
    }
    .schip:active { background: var(--accent-soft); }
    .schip .plus { color: var(--accent); font-weight: 800; }
    .sdone { color: var(--ok); font-size: .84rem; padding: 8px 12px 12px; font-weight: 600; }

    /* 祝福 */
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9998; }
    .toast {
      position: fixed; left: 50%; top: 36%; transform: translate(-50%, -50%) scale(.5);
      background: var(--card); color: var(--ink); border: 2px solid var(--gold);
      padding: 22px 28px; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.35);
      font-weight: 800; font-size: 1.15rem; text-align: center; line-height: 1.4;
      z-index: 9999; opacity: 0; transition: opacity .35s ease, transform .35s cubic-bezier(.2,1.4,.4,1);
      max-width: 84vw;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .toast small { display: block; font-size: .8rem; color: var(--sub); font-weight: 600; margin-top: 6px; }
    @keyframes ringPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    .ring.pulse { animation: ringPulse .5s ease 2; }
  </style>
</head>
<body>
  <header>
    <h1>🎯 お酒100種コンプリート</h1>
    <p>飲んだお酒の種類を集めて100種を目指そう</p>
  </header>

  <div class="progress">
    <div class="ring" id="ring">
      <div class="ring-inner">
        <div class="ring-num"><span id="pCount">0</span><span class="ring-den">/100</span></div>
        <div class="ring-lbl">コンプリート</div>
      </div>
    </div>
    <div class="pside">
      <div class="big"><span id="pPercent">0</span>% 達成</div>
      <div class="pbar"><i id="pFill"></i></div>
      <div class="sub">残り <b id="pRemain">100</b> 種</div>
      <div class="pmsg" id="pMsg"></div>
    </div>
  </div>

  <form id="form" autocomplete="off">
    <div class="row">
      <div class="field" style="flex:1.4">
        <label for="name">新しいお酒の名前</label>
        <input id="name" placeholder="例: 巨峰サワー" required>
      </div>
      <div class="field">
        <label for="emoji">アイコン</label>
        <select id="emoji">
          <option value="🍺">🍺</option><option value="🍶">🍶</option><option value="🍷">🍷</option>
          <option value="🥃">🥃</option><option value="🍸">🍸</option><option value="🍹">🍹</option>
          <option value="🥂">🥂</option><option value="🧊">🧊</option><option value="🍵">🍵</option>
          <option value="🍾">🍾</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="category">カテゴリ</label>
        <select id="category">
          <option value="ビール・泡・ワイン">🍺 ビール・泡・ワイン</option>
          <option value="ハイボール系">🥃 ハイボール系</option>
          <option value="サワー・チューハイ">🍹 サワー・チューハイ</option>
          <option value="お茶割り・その他">🍵 お茶割り・その他</option>
          <option value="日本酒・焼酎・スピリッツ">🍶 日本酒・焼酎・スピリッツ</option>
          <option value="その他">🍾 その他</option>
        </select>
      </div>
      <div class="field" style="flex:1.4">
        <label for="note">メモ（任意）</label>
        <input id="note" placeholder="店名・感想など">
      </div>
    </div>
    <button class="btn" type="submit">＋ コレクションに追加</button>
    <div class="msg" id="addMsg"></div>
  </form>

  <details id="suggestPanel">
    <summary>💡 おすすめ未取得（<span id="suggestCount">0</span>種・タップで追加）</summary>
    <div id="suggestList"></div>
  </details>

  <div class="toolbar">
    <h2>コレクション</h2>
    <input id="search" placeholder="🔍 名前で検索・重複確認">
  </div>
  <div id="list"></div>

  <div class="tools">
    <button id="exportBtn">エクスポート</button>
    <button id="importBtn">インポート</button>
    <button id="resetBtn">初期48種に戻す</button>
    <input id="importFile" type="file" accept="application/json,.json" style="display:none">
  </div>

  <script>
    const KEY = 'drinkCollection.v1';
    const GOAL = 100;
    const $ = id => document.getElementById(id);

    const CAT_ORDER = ['ビール・泡・ワイン','ハイボール系','サワー・チューハイ','お茶割り・その他','日本酒・焼酎・スピリッツ','その他'];
    const CAT_EMOJI = { 'ビール・泡・ワイン':'🍺','ハイボール系':'🥃','サワー・チューハイ':'🍹','お茶割り・その他':'🍵','日本酒・焼酎・スピリッツ':'🍶','その他':'🍾' };

    // 初期48種（整理済みマスターリスト）
    const SEED = [
      ['ビール・泡・ワイン', [['生ビール','🍺'],['ラガービール（赤星）','🍺'],['ビール','🍺'],['白スパークリングワイン','🥂'],['赤ワイン','🍷']]],
      ['ハイボール系', [['ハイボール','🥃'],['宇治抹茶ハイボール','🥃'],['ひげ茶ハイボール','🥃'],['ダンダダンハイボール','🥃'],['ラフロイグハイボール','🥃'],['生姜ハイボール','🥃'],['電気ハイボール','🥃'],['竹鶴ハイボール','🥃'],['白州ハイボール','🥃'],['デュワーズハイボール','🥃'],['コークハイ','🥃']]],
      ['サワー・チューハイ', [['りんごサワー','🍹'],['男梅サワー','🍹'],['クエン酸サワー','🍹'],['パインサワー','🍹'],['バイスサワー','🍹'],['マンゴーサワー','🍹'],['ぶどうサワー','🍹'],['ブラッドオレンジサワー','🍹'],['マスカットサワー','🍹'],['ポン酢サワー','🍹'],['ガリチューハイ','🍹'],['メガガリチューハイ','🍹'],['梅干しサワー','🍹'],['コボスサワー','🍹'],['イチゴサワー','🍹'],['けむりサワー','🍹'],['ラフランスサワー','🍹'],['トマトサワー','🍹'],['レモンサワー','🍹'],['ジンジャーハイ／サワー','🍹']]],
      ['お茶割り・その他', [['緑茶ハイ','🍵'],['茶杯','🍵'],['ほうじ茶割り','🍵'],['ウーロンハイ','🍵'],['紅茶杯','🍵'],['レモン杯','🍵']]],
      ['日本酒・焼酎・スピリッツ', [['日本酒','🍶'],['麦焼酎ソーダ割り','🧊'],['和麦ソーダ割り','🧊'],['翠ジン','🍸'],['プレーンソーダ','🍾'],['ラムハイ','🍾']]],
    ];

    function seedList() {
      const out = [];
      let i = 1;
      SEED.forEach(([cat, items]) => items.forEach(([name, emoji]) =>
        out.push({ id: 'seed-' + (i++), name, emoji, category: cat, note: '', date: '', seed: true })));
      return out;
    }

    // おすすめ未取得の候補プール（[名前, 絵文字, カテゴリ]）— 100種到達を後押し
    const SUGGESTIONS = [
      ['黒ビール','🍺','ビール・泡・ワイン'],['クラフトビール','🍺','ビール・泡・ワイン'],['IPA','🍺','ビール・泡・ワイン'],
      ['ヱビスビール','🍺','ビール・泡・ワイン'],['ロゼワイン','🍷','ビール・泡・ワイン'],['白ワイン','🍷','ビール・泡・ワイン'],
      ['グラスワイン','🍷','ビール・泡・ワイン'],['シードル','🍾','ビール・泡・ワイン'],['スパークリング日本酒','🥂','ビール・泡・ワイン'],['ミモザ','🥂','ビール・泡・ワイン'],
      ['角ハイボール','🥃','ハイボール系'],['トリスハイボール','🥃','ハイボール系'],['ジムビームハイボール','🥃','ハイボール系'],
      ['山崎ハイボール','🥃','ハイボール系'],['響ハイボール','🥃','ハイボール系'],['メガハイボール','🥃','ハイボール系'],
      ['レモンハイボール','🥃','ハイボール系'],['ジャックハイボール','🥃','ハイボール系'],
      ['巨峰サワー','🍹','サワー・チューハイ'],['カルピスサワー','🍹','サワー・チューハイ'],['グレープフルーツサワー','🍹','サワー・チューハイ'],
      ['白桃サワー','🍹','サワー・チューハイ'],['ゆずサワー','🍹','サワー・チューハイ'],['キウイサワー','🍹','サワー・チューハイ'],
      ['メロンサワー','🍹','サワー・チューハイ'],['青りんごサワー','🍹','サワー・チューハイ'],['カシスサワー','🍹','サワー・チューハイ'],
      ['シークワーサーサワー','🍹','サワー・チューハイ'],['塩レモンサワー','🍹','サワー・チューハイ'],['生レモンサワー','🍹','サワー・チューハイ'],
      ['冷凍みかんサワー','🍹','サワー・チューハイ'],['ライムサワー','🍹','サワー・チューハイ'],
      ['ジャスミンハイ','🍵','お茶割り・その他'],['黒烏龍ハイ','🍵','お茶割り・その他'],['そば茶ハイ','🍵','お茶割り・その他'],['玄米茶ハイ','🍵','お茶割り・その他'],
      ['熱燗','🍶','日本酒・焼酎・スピリッツ'],['冷酒','🍶','日本酒・焼酎・スピリッツ'],['芋焼酎','🧊','日本酒・焼酎・スピリッツ'],
      ['米焼酎','🧊','日本酒・焼酎・スピリッツ'],['泡盛','🧊','日本酒・焼酎・スピリッツ'],['黒糖焼酎','🧊','日本酒・焼酎・スピリッツ'],
      ['梅酒','🍶','日本酒・焼酎・スピリッツ'],['梅酒ソーダ','🍶','日本酒・焼酎・スピリッツ'],['ジンソーダ','🍸','日本酒・焼酎・スピリッツ'],['ウォッカソーダ','🍸','日本酒・焼酎・スピリッツ'],
      ['カシスオレンジ','🍸','その他'],['カシスソーダ','🍸','その他'],['モスコミュール','🍸','その他'],['ジントニック','🍸','その他'],
      ['スクリュードライバー','🍸','その他'],['ファジーネーブル','🍸','その他'],['カルーアミルク','🍸','その他'],['レゲエパンチ','🍸','その他'],
      ['ソルティドッグ','🍸','その他'],['ジンバック','🍸','その他'],['テキーラ','🥃','その他'],['ホッピー','🍺','その他'],
    ];

    const load = () => { try { const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : null; } catch { return null; } };
    const save = () => localStorage.setItem(KEY, JSON.stringify(entries));
    let entries = load() || seedList();
    if (!localStorage.getItem(KEY)) save();

    // 名前の正規化（重複判定用）
    function norm(s) {
      return String(s || '')
        .normalize('NFKC')
        .toLowerCase()
        .replace(/[\s　]/g, '')
        .replace(/[／/・･,、。．.\-ー―–‐()（）｢｣「」『』]/g, '');
    }
    const findExact = n => entries.find(e => norm(e.name) === norm(n));
    const findSimilar = n => {
      const k = norm(n);
      if (!k) return [];
      return entries.filter(e => { const m = norm(e.name); return m !== k && (m.includes(k) || k.includes(m)); });
    };

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderProgress() {
      const n = entries.length;
      const pct = Math.round(n / GOAL * 100);
      const deg = Math.min(360, n / GOAL * 360);
      $('pCount').textContent = n;
      $('pPercent').textContent = Math.min(100, pct);
      $('pRemain').textContent = Math.max(0, GOAL - n);
      $('pFill').style.width = Math.min(100, pct) + '%';
      $('ring').style.background = `conic-gradient(var(--accent) ${deg}deg, var(--line) ${deg}deg)`;
      let msg = '';
      if (n >= GOAL) msg = '🎉 100種コンプリート達成！おめでとう！';
      else if (n >= 90) msg = '🔥 ラストスパート！あと' + (GOAL - n) + '種！';
      else if (n >= 75) msg = '💪 残り1/4！いいペース';
      else if (n >= 50) msg = '🥂 折り返し突破！半分達成';
      else if (n >= 25) msg = '🍻 1/4達成！この調子';
      $('pMsg').textContent = msg;
    }

    function renderList() {
      const q = norm($('search').value);
      const groups = {};
      CAT_ORDER.forEach(c => groups[c] = []);
      entries.forEach(e => {
        if (q && !norm(e.name).includes(q)) return;
        (groups[e.category] || (groups[e.category] = [])).push(e);
      });
      const cats = CAT_ORDER.concat(Object.keys(groups).filter(c => !CAT_ORDER.includes(c)));
      let html = '';
      let shown = 0;
      cats.forEach(cat => {
        const items = groups[cat];
        if (!items || !items.length) return;
        shown += items.length;
        html += `<div class="cat"><h3><span>${CAT_EMOJI[cat] || '🍾'} ${esc(cat)}</span><span class="cnt">${items.length}</span></h3><div class="chips">`;
        items.forEach(e => {
          html += `<span class="chip ${e.seed ? 'seed' : 'custom'}" title="${esc(e.note)}">
            <span>${e.emoji || '🍾'}</span><span class="nm">${esc(e.name)}</span>
            <button class="x" data-id="${esc(e.id)}" title="削除">✕</button></span>`;
        });
        html += '</div></div>';
      });
      if (!shown) html = '<div class="cat"><div class="empty">' + ($('search').value ? '該当なし。新しい種類なら追加できます 🍶' : 'まだありません') + '</div></div>';
      $('list').innerHTML = html;
    }

    function renderSuggestions() {
      const notYet = SUGGESTIONS.filter(([n]) => !findExact(n));
      $('suggestCount').textContent = notYet.length;
      if (!notYet.length) {
        $('suggestList').innerHTML = '<div class="sdone">🏆 おすすめは全部コンプ！自分だけの一杯を追加していこう</div>';
        return;
      }
      const groups = {};
      notYet.forEach(([n, e, c]) => (groups[c] || (groups[c] = [])).push([n, e]));
      const cats = CAT_ORDER.filter(c => groups[c]);
      $('suggestList').innerHTML = cats.map(c => `
        <div class="sgroup">
          <h4>${CAT_EMOJI[c] || '🍾'} ${esc(c)}</h4>
          <div class="schips">
            ${groups[c].map(([n, e]) => `<button type="button" class="schip" data-name="${esc(n)}" data-emoji="${e}" data-cat="${esc(c)}"><span class="plus">＋</span>${e} ${esc(n)}</button>`).join('')}
          </div>
        </div>`).join('');
    }

    function render() { renderProgress(); renderList(); renderSuggestions(); }

    // 追加処理（フォーム・おすすめ共通）+ 達成チェック
    function pushDrink({ name, emoji, category, note }) {
      const before = entries.length;
      entries.push({
        id: 'c-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name, emoji, category, note: note || '',
        date: new Date().toISOString().slice(0, 10), seed: false
      });
      save();
      const after = entries.length;
      render();
      checkMilestones(before, after);
      return after;
    }

    function checkMilestones(before, after) {
      [25, 50, 75, GOAL].forEach(t => {
        if (before < t && after >= t) {
          if (t >= GOAL) {
            celebrate(true);
            showToast('🎉 100種コンプリート達成！', 'おめでとう！全制覇です 🏆');
          } else {
            celebrate(false);
            showToast(`🎊 ${t}種 到達！`, `残り ${GOAL - after} 種`);
          }
        }
      });
    }

    function showToast(main, sub) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = esc(main) + (sub ? `<small>${esc(sub)}</small>` : '');
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2600);
      const ring = $('ring');
      ring.classList.remove('pulse'); void ring.offsetWidth; ring.classList.add('pulse');
    }

    function celebrate(big) {
      const cvs = document.createElement('canvas');
      cvs.className = 'confetti';
      document.body.appendChild(cvs);
      const ctx = cvs.getContext('2d');
      const resize = () => { cvs.width = innerWidth; cvs.height = innerHeight; };
      resize();
      const colors = ['#a8542b', '#d4a017', '#2e7d5b', '#c0392b', '#e08a4f', '#5fc79a', '#d46a92', '#4a7fb5'];
      const N = big ? 200 : 70;
      const parts = [];
      for (let i = 0; i < N; i++) {
        parts.push({
          x: Math.random() * cvs.width,
          y: -20 - Math.random() * cvs.height * 0.6,
          w: 6 + Math.random() * 8, h: 9 + Math.random() * 10,
          c: colors[i % colors.length],
          vy: 2 + Math.random() * 3.5, vx: -1.4 + Math.random() * 2.8,
          rot: Math.random() * 6.28, vr: -0.25 + Math.random() * 0.5
        });
      }
      const dur = big ? 4500 : 2000;
      const start = performance.now();
      (function frame(now) {
        const el = now - start;
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        parts.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.rot += p.vr;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.globalAlpha = Math.max(0, 1 - el / dur);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (el < dur) requestAnimationFrame(frame);
        else { cvs.remove(); removeEventListener('resize', resize); }
      })(start);
      addEventListener('resize', resize);
    }

    // カテゴリ変更でアイコン初期化
    $('category').addEventListener('change', () => { $('emoji').value = CAT_EMOJI[$('category').value] || '🍾'; });

    function setMsg(text, cls) { const m = $('addMsg'); m.textContent = text; m.className = 'msg ' + (cls || ''); }

    $('form').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('name').value.trim();
      if (!name) return;
      const dup = findExact(name);
      if (dup) {
        setMsg(`⚠ すでに登録済みです：${dup.emoji} ${dup.name}（${dup.category}）`, 'err');
        return;
      }
      const sim = findSimilar(name);
      if (sim.length) {
        const ok = confirm(`似た名前が${sim.length}件あります：\n${sim.map(s => '・' + s.name).join('\n')}\n\n別の種類として追加しますか？`);
        if (!ok) { setMsg('追加をキャンセルしました', 'warn'); return; }
      }
      const n = pushDrink({ name, emoji: $('emoji').value, category: $('category').value, note: $('note').value.trim() });
      setMsg(`✅ 追加しました（${n}/${GOAL}種）` + (n >= GOAL ? ' 🎉コンプリート！' : ''), 'ok');
      $('name').value = ''; $('note').value = '';
      $('name').focus();
    });

    // おすすめ未取得をタップで追加
    $('suggestList').addEventListener('click', e => {
      const chip = e.target.closest('.schip');
      if (!chip) return;
      if (findExact(chip.dataset.name)) { renderSuggestions(); return; }
      const n = pushDrink({ name: chip.dataset.name, emoji: chip.dataset.emoji, category: chip.dataset.cat, note: '' });
      setMsg(`✅ 「${chip.dataset.name}」を追加（${n}/${GOAL}種）` + (n >= GOAL ? ' 🎉コンプリート！' : ''), 'ok');
    });

    // 入力中に重複を即時ヒント
    $('name').addEventListener('input', () => {
      const v = $('name').value.trim();
      if (!v) { setMsg('', ''); return; }
      const dup = findExact(v);
      if (dup) setMsg(`⚠ 登録済み：${dup.emoji} ${dup.name}`, 'err');
      else {
        const sim = findSimilar(v);
        if (sim.length) setMsg(`💡 似た項目：${sim.map(s => s.name).join('、')}`, 'warn');
        else setMsg('✨ 新種！追加できます', 'ok');
      }
    });

    $('list').addEventListener('click', e => {
      const btn = e.target.closest('.x');
      if (!btn) return;
      const item = entries.find(x => x.id === btn.dataset.id);
      if (item && confirm(`「${item.name}」を削除しますか？`)) {
        entries = entries.filter(x => x.id !== btn.dataset.id);
        save();
        render();
      }
    });

    $('search').addEventListener('input', renderList);

    $('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `drink-collection-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error();
          let added = 0, skipped = 0;
          const merge = confirm(`${data.length}件を読み込みます。\nOK＝現在のリストに統合（重複除外）\nキャンセル＝完全に置き換え`);
          if (!merge) { entries = data; }
          else {
            data.forEach(d => {
              if (d && d.name && !findExact(d.name)) { entries.push({ ...d, id: d.id || 'c-' + (Date.now() + added) }); added++; }
              else skipped++;
            });
          }
          save(); render();
          setMsg(merge ? `統合完了：${added}件追加 / ${skipped}件は重複でスキップ` : `${data.length}件に置き換えました`, 'ok');
        } catch { setMsg('読み込み失敗。JSONファイルを確認してください', 'err'); }
        e.target.value = '';
      };
      reader.readAsText(file);
    });
    $('resetBtn').addEventListener('click', () => {
      if (confirm('コレクションを初期の48種に戻します。追加した種類は削除されます。よろしいですか？')) {
        entries = seedList(); save(); render(); setMsg('初期48種に戻しました', 'warn');
      }
    });

    render();
  </script>
</body>
</html>
