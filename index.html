<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5b3a29">
  <title>飲んだお酒リスト</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #ffffff;
      --ink: #2b2320;
      --sub: #8a7d72;
      --line: #e7ded4;
      --accent: #a8542b;
      --accent-soft: #f3e3d8;
      --danger: #c0392b;
      --shadow: 0 2px 10px rgba(80,50,30,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1815;
        --card: #292320;
        --ink: #f2ebe4;
        --sub: #a89a8d;
        --line: #3a322c;
        --accent: #e08a4f;
        --accent-soft: #3a2c22;
        --danger: #e57368;
        --shadow: 0 2px 12px rgba(0,0,0,.3);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.5;
      padding: 0 0 40px;
      max-width: 640px;
      margin: 0 auto;
    }
    header {
      padding: 22px 18px 16px;
      text-align: center;
    }
    header h1 { font-size: 1.35rem; letter-spacing: .04em; }
    header p { color: var(--sub); font-size: .8rem; margin-top: 4px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 14px 16px;
    }
    .stat {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat .num { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .stat .lbl { font-size: .68rem; color: var(--sub); margin-top: 2px; }

    form {
      background: var(--card);
      border-radius: 16px;
      margin: 0 14px 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .row { display: flex; gap: 10px; margin-bottom: 12px; }
    .field { flex: 1; }
    label { display: block; font-size: .72rem; color: var(--sub); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 44px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:active { opacity: .85; }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 20px 8px;
    }
    .list-head h2 { font-size: .95rem; }
    .list-head .filter { font-size: .78rem; color: var(--accent); background: none; border: none; cursor: pointer; font-family: inherit; }

    .entry {
      background: var(--card);
      border-radius: 14px;
      margin: 0 14px 10px;
      padding: 13px 15px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .entry .emoji { font-size: 1.6rem; line-height: 1; margin-top: 2px; }
    .entry .body { flex: 1; min-width: 0; }
    .entry .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .entry .name { font-weight: 600; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry .meta { color: var(--sub); font-size: .74rem; margin-top: 2px; }
    .entry .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: var(--accent-soft); color: var(--accent); font-size: .68rem; padding: 2px 8px; border-radius: 20px; }
    .entry .note { color: var(--sub); font-size: .78rem; margin-top: 6px; word-break: break-word; }
    .entry .del { background: none; border: none; color: var(--sub); font-size: 1.1rem; cursor: pointer; padding: 0 2px; line-height: 1; }
    .entry .del:active { color: var(--danger); }

    .empty { text-align: center; color: var(--sub); padding: 40px 20px; font-size: .9rem; }
    .rating { color: var(--accent); font-size: .8rem; }

    .tools { display: flex; gap: 10px; padding: 18px 14px 0; }
    .tools button {
      flex: 1; background: none; border: 1px solid var(--line); color: var(--sub);
      border-radius: 10px; padding: 10px; font-size: .8rem; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍶 飲んだお酒リスト</h1>
    <p>飲んだお酒を記録して管理しよう</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">総記録数</div></div>
    <div class="stat"><div class="num" id="stMonth">0</div><div class="lbl">今月</div></div>
    <div class="stat"><div class="num" id="stAlcohol">0<span style="font-size:.7rem">g</span></div><div class="lbl">純アルコール今月</div></div>
  </div>

  <form id="form">
    <div class="row">
      <div class="field" style="flex:1.3">
        <label for="name">お酒の名前</label>
        <input id="name" placeholder="例: 獺祭 純米大吟醸" required>
      </div>
      <div class="field">
        <label for="type">種類</label>
        <select id="type">
          <option value="🍺">ビール 🍺</option>
          <option value="🍶">日本酒 🍶</option>
          <option value="🍷">ワイン 🍷</option>
          <option value="🥃">ウイスキー 🥃</option>
          <option value="🍸">カクテル 🍸</option>
          <option value="🍹">サワー/酎ハイ 🍹</option>
          <option value="🥂">スパークリング 🥂</option>
          <option value="🧊">焼酎 🧊</option>
          <option value="🍾">その他 🍾</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="date">飲んだ日</label>
        <input id="date" type="date" required>
      </div>
      <div class="field">
        <label for="volume">量 (ml)</label>
        <input id="volume" type="number" inputmode="decimal" min="0" step="1" placeholder="350">
      </div>
      <div class="field">
        <label for="abv">度数 (%)</label>
        <input id="abv" type="number" inputmode="decimal" min="0" max="100" step="0.1" placeholder="5">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="rating">評価</label>
        <select id="rating">
          <option value="0">評価なし</option>
          <option value="5">★★★★★</option>
          <option value="4">★★★★</option>
          <option value="3">★★★</option>
          <option value="2">★★</option>
          <option value="1">★</option>
        </select>
      </div>
      <div class="field" style="flex:2">
        <label for="note">メモ (場所・感想など)</label>
        <input id="note" placeholder="家飲み / すっきり辛口で美味しかった">
      </div>
    </div>
    <button class="btn" type="submit">＋ 記録する</button>
  </form>

  <div class="list-head">
    <h2>記録一覧</h2>
    <button class="filter" id="sortBtn">新しい順 ▾</button>
  </div>
  <div id="list"></div>

  <div class="tools">
    <button id="exportBtn">エクスポート (JSON)</button>
    <button id="importBtn">インポート</button>
    <input id="importFile" type="file" accept="application/json,.json" style="display:none">
  </div>

  <script>
    const KEY = 'drinkLog.v1';
    const $ = id => document.getElementById(id);
    let sortNewest = true;

    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
    const save = data => localStorage.setItem(KEY, JSON.stringify(data));
    let entries = load();

    // default date = today
    $('date').value = new Date().toISOString().slice(0, 10);

    function pureAlcoholGrams(volume, abv) {
      if (!volume || !abv) return 0;
      return volume * (abv / 100) * 0.8; // 純アルコール量(g) = 量ml × 度数/100 × 比重0.8
    }

    function stars(n) {
      n = Number(n) || 0;
      return n ? '★★★★★'.slice(0, n) : '';
    }

    function fmtDate(iso) {
      const d = new Date(iso + 'T00:00');
      if (isNaN(d)) return iso;
      const w = ['日','月','火','水','木','金','土'][d.getDay()];
      return `${d.getMonth() + 1}/${d.getDate()}(${w})`;
    }

    function render() {
      // stats
      const now = new Date();
      const ym = now.toISOString().slice(0, 7);
      const monthEntries = entries.filter(e => (e.date || '').slice(0, 7) === ym);
      const alc = monthEntries.reduce((s, e) => s + pureAlcoholGrams(e.volume, e.abv), 0);
      $('stTotal').textContent = entries.length;
      $('stMonth').textContent = monthEntries.length;
      $('stAlcohol').innerHTML = Math.round(alc) + '<span style="font-size:.7rem">g</span>';

      const list = $('list');
      if (!entries.length) {
        list.innerHTML = '<div class="empty">まだ記録がありません。<br>最初の一杯を記録しよう 🍻</div>';
        return;
      }
      const sorted = [...entries].sort((a, b) => {
        const c = (a.date || '').localeCompare(b.date || '') || (a.id - b.id);
        return sortNewest ? -c : c;
      });
      list.innerHTML = sorted.map(e => {
        const alcG = pureAlcoholGrams(e.volume, e.abv);
        const tags = [];
        if (e.volume) tags.push(`${e.volume}ml`);
        if (e.abv) tags.push(`${e.abv}%`);
        if (alcG) tags.push(`純アルコール ${alcG.toFixed(1)}g`);
        return `<div class="entry">
          <div class="emoji">${e.type || '🍾'}</div>
          <div class="body">
            <div class="top">
              <span class="name">${esc(e.name)}</span>
              <button class="del" data-id="${e.id}" title="削除">✕</button>
            </div>
            <div class="meta">${fmtDate(e.date)} ${e.rating ? '<span class="rating">' + stars(e.rating) + '</span>' : ''}</div>
            ${tags.length ? '<div class="tags">' + tags.map(t => '<span class="tag">' + t + '</span>').join('') + '</div>' : ''}
            ${e.note ? '<div class="note">' + esc(e.note) + '</div>' : ''}
          </div>
        </div>`;
      }).join('');
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    $('form').addEventListener('submit', e => {
      e.preventDefault();
      const entry = {
        id: Date.now(),
        name: $('name').value.trim(),
        type: $('type').value,
        date: $('date').value,
        volume: parseFloat($('volume').value) || 0,
        abv: parseFloat($('abv').value) || 0,
        rating: parseInt($('rating').value) || 0,
        note: $('note').value.trim()
      };
      if (!entry.name || !entry.date) return;
      entries.push(entry);
      save(entries);
      render();
      // reset (keep date)
      const d = $('date').value;
      e.target.reset();
      $('date').value = d;
      $('name').focus();
    });

    $('list').addEventListener('click', e => {
      const btn = e.target.closest('.del');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const item = entries.find(x => x.id === id);
      if (confirm(`「${item ? item.name : 'この記録'}」を削除しますか？`)) {
        entries = entries.filter(x => x.id !== id);
        save(entries);
        render();
      }
    });

    $('sortBtn').addEventListener('click', () => {
      sortNewest = !sortNewest;
      $('sortBtn').textContent = (sortNewest ? '新しい順' : '古い順') + ' ▾';
      render();
    });

    $('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `drink-log-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error();
          if (confirm(`${data.length}件を読み込みます。現在の記録に追加しますか？（キャンセルで置き換え）`)) {
            entries = entries.concat(data);
          } else {
            entries = data;
          }
          // ensure unique ids
          entries = entries.map((x, i) => ({ ...x, id: x.id || Date.now() + i }));
          save(entries);
          render();
        } catch {
          alert('読み込みに失敗しました。JSONファイルを確認してください。');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    render();
  </script>
</body>
</html>
